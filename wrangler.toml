# Configuración de Cloudflare Workers Static Assets para ERP-aio (web).
# Sirve la web estática exportada por Expo (web-build/) desde el edge de Cloudflare.
# Dominio final: https://app.gritlabs.app
# NO afecta a los builds de APK Android ni al .exe de Electron.
#
# Docs: https://developers.cloudflare.com/workers/static-assets/

name = "erp-aio"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Assets estáticos (la SPA compilada por Expo).
[assets]
directory = "./web-build"
# SPA fallback: cualquier ruta no encontrada devuelve index.html con status 200.
# Reemplaza al archivo public/_redirects y hace que React Navigation funcione
# con URLs directas (ej. /ventas/123).
not_found_handling = "single-page-application"

# Nota: Las variables EXPO_PUBLIC_* NO se ponen aquí porque Expo las inyecta
# en tiempo de BUILD, no en runtime. Se configuran como Build variables en el
# dashboard de Cloudflare Workers (Settings -> Variables and Secrets -> Build).
